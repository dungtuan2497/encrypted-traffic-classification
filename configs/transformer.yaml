# Small ET-BERT-style byte Transformer (review Section 5.3.1): pre-train + fine-tune.
model:
  name: transformer
  vocab_size: 260        # 256 bytes + [PAD], [CLS], [SEP], [MASK]
  max_len: 512
  max_packets: 32        # size of the packet-index embedding table
  d_model: 256
  n_layers: 4
  n_heads: 4
  ffn_dim: 1024
  dropout: 0.1

pretrain:
  # Reduced from 10 epochs / batch 64 (option 1): on an Apple M2 (16 GB) batch 64 x 512
  # tokens causes memory pressure; batch 32 runs ~11 min/epoch on the full train split.
  epochs: 5
  batch_size: 32
  lr: 5.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  mask_prob: 0.15        # BERT rule: of masked tokens 80% [MASK], 10% random, 10% unchanged
  mask_token_ratio: 0.8
  random_token_ratio: 0.1

finetune:
  epochs: 5              # reduced from 15 (option 1, laptop budget)
  batch_size: 32
  lr_encoder: 5.0e-5     # pre-trained encoder
  lr_scratch: 5.0e-4     # encoder lr for the --from-scratch baseline
  lr_head: 1.0e-3
  warmup_ratio: 0.05
  weight_decay: 0.01
  patience: 5
  min_steps: 1500        # stretch epochs/patience when few labels (RQ2)
  class_weight: true
  label_fraction: 1.0
  from_scratch: false
