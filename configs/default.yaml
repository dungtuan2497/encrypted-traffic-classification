# Shared settings for every stage. Model configs are merged on top of this file.
seed: 42

paths:
  raw_dir: data/raw/ustc-tfc2016
  processed_dir: data/processed
  results_dir: results
  reports_dir: reports
  checkpoints_dir: checkpoints

preprocess:
  max_packets_per_session: 32
  max_sessions_per_class: 5000
  min_packets_per_session: 3
  drop_tcp_no_payload: true   # drop pure ACKs / empty TCP segments
  drop_dns: true              # drop port-53 traffic
  seq_len: 32                 # length of the packet-size sequence (GRU)
  bytes_per_packet: 64        # bytes kept from each packet (byte representation)
  max_bytes: 784              # flat byte vector length (CNN, Wang et al. 2017)
  mask_ip: true               # zero src/dst IP (+ IP/TCP/UDP checksums)
  mask_port: false            # zero src/dst port (RQ3 ablation)

split:
  train: 0.8
  val: 0.1
  test: 0.1

eval:
  latency_warmup: 20
  latency_iters: 200
  throughput_batch: 256
